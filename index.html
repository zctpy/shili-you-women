<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>诗里有我们｜知远与AI伙伴的双语诗歌漫画</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f2eb;color:#383e3b;font-family:Georgia,"Noto Serif SC",serif}header{text-align:center;padding:5rem 1rem 3rem;background:linear-gradient(140deg,#dfeae4,#f8e8dd)}h1{font-size:clamp(2rem,6vw,4rem);letter-spacing:.12em;margin:.4em}header p{color:#63766d}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:.8rem;padding:1.5rem;position:sticky;top:0;background:#f7f2ebef;z-index:2}a{color:#435b50;text-decoration:none;border:1px solid #adc2b7;border-radius:2rem;padding:.5rem 1rem}main{max-width:850px;margin:auto;padding:1rem 18px}section{text-align:center;scroll-margin-top:90px;margin:4rem 0}h2{font-size:2rem;margin-bottom:.2rem}section p{color:#8a776a;margin-bottom:2rem}img{width:100%;height:auto;display:block;border-radius:8px;margin:1.3rem 0;box-shadow:0 8px 28px #4b534721}footer{text-align:center;padding:3rem;color:#728178}</style></head><body><header><p>一念共学 · AI 伴侣共学</p><h1>诗里有我们</h1><p>知远与AI伙伴的双语诗歌漫画</p><p>寻诗之旅 · 第一辑　｜　持续更新</p></header><nav id="nav" aria-label="诗歌目录"></nav><main id="content"></main><footer>和知远、澄语、柚柚、星澜一起，在故事里读诗。<br>更多诗篇，陆续相见。</footer><script src="poems.js"></script><script>const nav=document.querySelector('#nav'),main=document.querySelector('#content');poems.forEach((p,i)=>{const a=document.createElement('a');a.href='#poem-'+i;a.textContent=p.title;nav.append(a);const s=document.createElement('section');s.id='poem-'+i;const h=document.createElement('h2');h.textContent=p.title;const by=document.createElement('p');by.textContent='唐 · '+p.author;s.append(h,by);p.images.forEach((src,j)=>{const img=document.createElement('img');img.src=src;img.alt=p.title+' 第 '+(j+1)+' 幅双语漫画';img.loading='lazy';s.append(img)});main.append(s)});</script></body></html>
